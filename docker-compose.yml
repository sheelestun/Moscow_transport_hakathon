# Весь стек локально: ML-ядро + backend + дашборд + Postgres; эмулятор NDTP — по профилю `emulator`.
#
#   docker compose up -d --build                            # стек; поток — проигрывание исторического датасета
#   docker load -i dataset/ndtp-telemetry-emulator.tar      # один раз: образ эмулятора организаторов
#   docker compose --profile emulator up -d                 # + эмулятор NDTP (управление на :18080)
#
# Дашборд http://localhost:3000 · Swagger backend http://localhost:8000/docs · Swagger ML http://localhost:8001/docs
# NDTP (TCP) — localhost:9201. Тот же стек на сервере (nginx, TLS, ML наружу не открыт) — infra/deploy/.

services:

  ml:
    # FastAPI + CatBoost-ансамбль. Модели — ml/artifacts (лежат в git); папка смонтирована,
    # так что переобученные модели подхватываются через POST /reload без пересборки.
    build: ./ml
    ports:
      - "8001:8001"
    volumes:
      - ./ml/artifacts:/app/artifacts:ro
    environment:
      ML_MODEL_VERSION: catboost-ensemble
      # Подсказку cur_dev_s backend считает по GPS-прибытиям — для неё обучен комплект catboost_gps_*.
      ML_DEFAULT_CUR_DEV_MODE: gps
    restart: unless-stopped

  backend:
    # Приём NDTP, сопоставление с расписанием, прогнозы через ML, алерты, REST + WebSocket.
    # Без depends_on намеренно: без ML прогнозирует бейзлайн, без Postgres копит историю в памяти —
    # деградирует и подхватывает их, когда они поднимутся.
    build: ./backend
    ports:
      - "8000:8000"   # HTTP API, Swagger /docs, WebSocket /ws
      - "9201:9201"   # NDTP-приёмник (TCP) для терминалов и эмулятора
    environment:
      ML_URL: http://ml:8001
      DATABASE_URL: postgresql://msk:msk@postgres:5432/msk_transport
      DATASET_DIR: /data
      # Датасет — один день, 2026-01-06. По умолчанию часы стартуют с утреннего пика, чтобы на карте
      # было движение в любое время суток. Пусто (CLOCK_START=) — текущее время суток МСК.
      CLOCK_START: ${CLOCK_START-2026-01-06T08:00:00}
      CLOCK_SPEED: ${CLOCK_SPEED:-1}
    volumes:
      # Распакованный архив организаторов (validate/traffic.csv, validate/schedule_plan.csv, ...).
      - ${DATASET_DIR:-./dataset}:/data:ro
    restart: unless-stopped

  frontend:
    # Дашборд: статика под nginx. entrypoint.sh подставляет адреса API в config.js;
    # браузер ходит к backend с хоста, поэтому localhost.
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      MODE: live
      API_BASE: http://localhost:8000
      WS_URL: ws://localhost:8000/ws
    restart: unless-stopped

  postgres:
    # История: телеметрия, прибытия, прогнозы, алерты. Наружу не публикуется.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: msk
      POSTGRES_PASSWORD: msk
      POSTGRES_DB: msk_transport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msk -d msk_transport"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ndtp-emu:
    # Эмулятор NDTP от организаторов (Java). Образа нет в Docker Hub — сначала `docker load`, см. выше.
    # Куда и что слать, задаётся через POST /api/config: infra/emulator_replay.py (реальные треки)
    # или infra/emulator-config.json (случайное блуждание).
    image: ndtp-telemetry-emulator:1.0
    profiles:
      - emulator
    ports:
      - "18080:18080"
    restart: unless-stopped

volumes:
  pgdata:
