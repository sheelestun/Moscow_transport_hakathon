# Локальный дашборд на данных с сайта (api.mowtransit.ru).
# Отдаёт файлы прямо из папки frontend (правки видны сразу, без пересборки),
# а запросы к API пропускает через себя на /api — поэтому браузер не блокирует их (CORS).
# Запуск — dev/live.bat, подробности — frontend/README.md, раздел «Смотреть на данных с сайта».

map $http_upgrade $conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # не кэшировать — после сохранения файла достаточно обновить страницу
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket: ws://localhost:3001/api/ws → wss://api.mowtransit.ru/ws
    location /api/ws {
        proxy_pass https://api.mowtransit.ru/ws;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.mowtransit.ru;
        proxy_set_header Origin https://app.mowtransit.ru;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conn_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # REST: /api/routes → https://api.mowtransit.ru/routes
    location /api/ {
        proxy_pass https://api.mowtransit.ru/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.mowtransit.ru;
        proxy_set_header Origin https://app.mowtransit.ru;
    }
}
