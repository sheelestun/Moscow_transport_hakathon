server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Браузер каждый раз сверяется с сервером (304, если файл не менялся) —
    # после правки достаточно обновить страницу, старые js из кэша не всплывают.
    add_header Cache-Control "no-cache";

    # config.js с подставленными MODE/API_BASE/WS_URL — его пишет entrypoint.sh при старте контейнера
    location = /js/config.js {
        alias /usr/share/nginx/runtime/config.js;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
