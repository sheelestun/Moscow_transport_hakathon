[pytest]
# Единая точка запуска: `pytest` из корня прогоняет backend + ml + statistics.
# CI и локальный dev-loop одинаковы, никаких сюрпризов вроде «а у меня не воспроизводится».
#
# mock_backend/tests не включены: это тесты старого бэкенда (`from main import app`).
testpaths = backend/tests ml/tests statistics/tests
# Новый бэкенд — пакет `app` в ./backend (импорты вида `from app.ndtp import ...`).
pythonpath = backend
python_files = test_*.py
addopts = -ra --tb=short
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
