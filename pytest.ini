[pytest]
# Единая точка запуска: `pytest` из корня прогоняет ml + statistics.
# CI и локальный dev-loop одинаковы, никаких сюрпризов вроде «а у меня не воспроизводится».
#
# backend/tests временно отключены: это копия тестов старого бэкенда
# (`from main import app`), а в новом ./backend ещё нет src/main.py — прогон
# падал бы на сборе. Вернуть, когда появятся тесты под новый бэкенд.
#   testpaths = backend/tests mock_backend/tests ml/tests statistics/tests
testpaths = ml/tests statistics/tests
python_files = test_*.py
addopts = -ra --tb=short
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
