# api.mowtransit.ru → backend on 127.0.0.1:8000: REST, Swagger UI (/docs), WebSocket (/ws).
# Plain HTTP here; `certbot --nginx` adds TLS and the HTTP → HTTPS redirect.

map $http_upgrade $mowtransit_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.mowtransit.ru;

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mowtransit_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the dashboard keeps the socket open for hours; the server pushes every second
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
