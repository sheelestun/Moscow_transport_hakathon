# docs.mowtransit.ru → the Sphinx HTML build (docs/sphinx), copied to /var/www/mowtransit-docs.
# Plain HTTP here; `certbot --nginx` adds TLS and the HTTP → HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name docs.mowtransit.ru;

    root /var/www/mowtransit-docs;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
